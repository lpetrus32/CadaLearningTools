{% load static %}

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Traducteur</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Select2 -->
    <link
        href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container-fluid px-2 px-lg-4 py-2">

    <!-- ====================================================== -->
    <!-- ZONE DE SAISIE -->
    <!-- ====================================================== -->

    <header class="mb-3">

        <div class="card border-0 shadow-sm">

            <div class="card-body p-3">

                <form method="post">

                    {% csrf_token %}

                    <div class="row g-3 align-items-start">

                        <!-- LANGUES -->

                        <div class="col-12 col-lg-5">

                            <label
                                for="languages"
                                class="form-label fw-semibold mb-1"
                            >
                                Langues
                            </label>

                            <select
                                id="languages"
                                name="languages"
                                class="form-select"
                                multiple
                            >

                                {% for language in LANGUAGES %}

                                    <option
                                        value="{{ language.code }}"
                                        {% if language.code in SELECTED_LANG %}
                                            selected
                                        {% endif %}
                                    >
                                        {{ language.name }}
                                        {% if language.native_name != language.name %}
                                            ({{ language.native_name }})
                                        {% endif %}
                                    </option>

                                {% endfor %}

                            </select>

                            <div class="mt-2">
                                <button
                                    type="submit"
                                    class="btn btn-primary px-4"
                                >
                                    Traduire
                                </button>
                            </div>

                        </div>


                        <!-- TEXTE -->

                        <div class="col-12 col-lg-7">

                            <label
                                for="text"
                                class="form-label fw-semibold mb-1"
                            >
                                Texte
                            </label>

                            <textarea
                                id="text"
                                name="text"
                                class="form-control fs-5"
                                rows="4"
                                placeholder="Écrivez ou collez votre texte ici..."
                            >{{ TEXT }}</textarea>

                        </div>

                    </div>

                </form>

            </div>

        </div>

    </header>


    <!-- ====================================================== -->
    <!-- RÉSULTATS -->
    <!-- ====================================================== -->

    {% if TRANSLATIONS %}

        <main>

            <div class="row g-2">

                {% for translation in TRANSLATIONS %}

                    <div class="col-12 col-md-6 col-xl-4 col-xxl-3">

                        <div class="card h-100 shadow-sm border-2">

                            <div class="
                                card-header
                                border-0
                                text-uppercase
                                fw-bold
                                small
                                py-2
                                {% cycle 'bg-primary-subtle' 'bg-success-subtle' 'bg-warning-subtle' 'bg-info-subtle' %}
                            ">
                                {{ translation.language }}
                            </div>

                            <div class="
                                card-body
                                d-flex
                                align-items-start
                                p-3
                            ">

                                <div class="fs-4 fw-semibold lh-sm">
                                    {{ translation.text }}
                                </div>

                            </div>

                        </div>

                    </div>

                {% endfor %}

            </div>

        </main>


    {% elif request.method == "POST" %}

        <div
            class="alert alert-warning mt-2"
            role="alert"
        >
            Sélectionnez au moins une langue et saisissez un texte.
        </div>

    {% endif %}

</div>


<!-- ====================================================== -->
<!-- SCRIPTS -->
<!-- ====================================================== -->

<script
    src="https://code.jquery.com/jquery-3.7.1.min.js">
</script>

<script
    src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js">
</script>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

<script src="{% static 'Traductor/js/traductor.js' %}"></script>

</body>
</html>
